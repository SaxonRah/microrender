name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run irrelevant. Cancelling it also prevents a
# wedged platform job from consuming the full hosted-runner limit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-sanitized:
    name: ${{ matrix.os }} / ${{ matrix.pixel_format }} / ASan+UBSan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pin runner generations so a "-latest" migration cannot silently
        # replace the compiler underneath the test matrix.
        os: [ubuntu-24.04, macos-15]
        pixel_format: [rgb565, index8]
        include:
          - pixel_format: rgb565
            index8: "OFF"
          - pixel_format: index8
            index8: "ON"

    steps:
      - uses: actions/checkout@v6

      # GCC/Clang own the sanitizer coverage: ASan + UBSan, no recovery, and
      # strict warnings on the shared renderer core.
      - name: Configure
        run: >
          cmake -S tests -B build-tests
          -DCMAKE_BUILD_TYPE=Debug
          -DMR_TESTS_INDEX8=${{ matrix.index8 }}
          -DMR_TESTS_WERROR=ON
          -DMR_TESTS_SANITIZE=ON

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Unit tests
        run: >
          ctest --test-dir build-tests
          --output-on-failure
          --timeout 60
          --no-tests=error
          -R '^unit$'

      - name: Deterministic fuzz seeds
        run: >
          ctest --test-dir build-tests
          --output-on-failure
          --timeout 120
          --no-tests=error
          -R '^fuzz_'

  host-windows:
    name: windows-2022 / VS2022 / ${{ matrix.pixel_format }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pixel_format: [rgb565, index8]
        include:
          - pixel_format: rgb565
            index8: "OFF"
          - pixel_format: index8
            index8: "ON"

    steps:
      - uses: actions/checkout@v6

      # Pin the production compiler generation used by the project. The
      # windows-latest image moved to VS2026, whose MSVC AddressSanitizer jobs hung
      # in both test binaries. Windows still provides mandatory
      # MSVC correctness coverage here; sanitizer coverage is mandatory above.
      - name: Configure
        run: >
          cmake -S tests -B build-tests
          -G "Visual Studio 17 2022"
          -A x64
          -DMR_TESTS_INDEX8=${{ matrix.index8 }}
          -DMR_TESTS_WERROR=ON
          -DMR_TESTS_SANITIZE=OFF

      - name: Build
        run: cmake --build build-tests --config Debug --parallel

      - name: Unit tests
        run: >
          ctest --test-dir build-tests
          --build-config Debug
          --output-on-failure
          --timeout 60
          --no-tests=error
          -R '^unit$'

      - name: Deterministic fuzz seeds
        run: >
          ctest --test-dir build-tests
          --build-config Debug
          --output-on-failure
          --timeout 120
          --no-tests=error
          -R '^fuzz_'

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S tests -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DMR_TESTS_SANITIZE=OFF

      - name: Build
        run: cmake --build build-bench --target mr_test_bench --parallel

      # Runner performance varies. Record the complete result, but do not gate
      # the build on a machine-specific FPS threshold.
      - name: Run benchmark
        shell: bash
        run: |
          set -o pipefail
          {
            echo '```text'
            ./build-bench/mr_test_bench 200
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  asset-pipeline:
    name: asset pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # shared/generated is deliberately ignored, so CI validates that the
      # source assets rebuild successfully and deterministically instead of
      # comparing against a file that is not present in a clean checkout.
      - name: Build asset pack twice
        working-directory: shared
        run: |
          set -euo pipefail
          python tools/mr_pack.py \
            --manifest assets/project.json \
            -o /tmp/GAME_A.MRP \
            --header /tmp/game_mrp_a.h \
            --symbol game_mrp
          python tools/mr_pack.py \
            --manifest assets/project.json \
            -o /tmp/GAME_B.MRP \
            --header /tmp/game_mrp_b.h \
            --symbol game_mrp

      - name: Validate deterministic pack output
        run: |
          set -euo pipefail
          test -s /tmp/GAME_A.MRP
          test -s /tmp/game_mrp_a.h
          cmp /tmp/GAME_A.MRP /tmp/GAME_B.MRP
          cmp /tmp/game_mrp_a.h /tmp/game_mrp_b.h
          python - <<'PY'
          import pathlib
          import struct

          path = pathlib.Path('/tmp/GAME_A.MRP')
          data = path.read_bytes()
          if len(data) < 12:
              raise SystemExit('asset pack is shorter than its 12-byte header')
          if data[:4] != b'MRP1':
              raise SystemExit(f'bad asset-pack magic: {data[:4]!r}')
          count = struct.unpack_from('<H', data, 4)[0]
          data_offset = struct.unpack_from('<I', data, 8)[0]
          if count == 0:
              raise SystemExit('asset pack contains no entries')
          if not 12 <= data_offset <= len(data):
              raise SystemExit(
                  f'invalid data offset {data_offset} for {len(data)}-byte pack')
          print(f'validated deterministic MRP1 pack: {count} entries, '
                f'{len(data)} bytes')
          PY
